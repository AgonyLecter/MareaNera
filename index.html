<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="landscape">
<link rel="manifest" href="manifest.json">
<title>MAREA NERA — Capitolo I: Il Pescato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#d9d2c3;font-family:'IM Fell English',Georgia,serif;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.sc{font-family:'IM Fell English SC',Georgia,serif;letter-spacing:1px}
button{font-family:'IM Fell English SC',Georgia,serif;cursor:pointer}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .6s}
#hudTL{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));font-size:15px;line-height:1.4;text-shadow:0 0 6px #000,0 0 2px #000}
#hudTL .big{font-family:'IM Fell English SC';font-size:19px;color:#efe6d0;letter-spacing:1px}
#hudTL .gold{color:#e8c48a}
#hudTL .red{color:#c8735f}
#compass{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(44vw,380px);height:40px;overflow:hidden;
  background:linear-gradient(90deg,transparent,#000a 18%,#000a 82%,transparent);border-top:1px solid #d9d2c333;border-bottom:1px solid #d9d2c333}
.cmk{position:absolute;top:3px;transform:translateX(-50%);font-size:13px;text-align:center;white-space:nowrap;text-shadow:0 0 4px #000;line-height:1.1}
.cmk small{display:block;font-size:10px;opacity:.75}
.cmk.card{color:#8f877a;top:11px;font-family:'IM Fell English SC'}
.cmk.port{color:#e8c48a}
.cmk.fossa{color:#7fd6a2;text-shadow:0 0 8px #2f8,0 0 3px #000}
#compass:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#d9d2c366}
#hudTR{position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));pointer-events:auto;display:flex;gap:8px}
.icoBtn{width:40px;height:40px;border-radius:50%;border:1px solid #d9d2c355;background:#0009;color:#d9d2c3;font-size:17px}
#keysHint{position:absolute;left:14px;bottom:12px;font-size:13px;opacity:.55;text-shadow:0 0 4px #000}

#joy{position:absolute;left:calc(20px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;
  border:2px solid #d9d2c33a;background:radial-gradient(#0007,#0002 70%);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(#d9d2c344,#d9d2c318);border:2px solid #d9d2c370}
#act{position:absolute;right:calc(22px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:108px;height:108px;border-radius:50%;
  border:2px solid #e8c48a;background:radial-gradient(#3a2a14dd,#120c06dd);color:#f3dfb5;font-size:17px;pointer-events:auto;touch-action:none;
  box-shadow:0 0 22px #e8a04a44,inset 0 0 18px #000;transition:transform .1s,opacity .3s}
#act:active,#act.down{transform:scale(.93)}
#act small{display:block;font-size:10px;opacity:.6;font-family:'IM Fell English'}
#act.cursed{border-color:#7fd6a2;color:#bff5d4;box-shadow:0 0 26px #2f885566,inset 0 0 18px #000}

#toast{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;
  font-size:18px;text-align:center;max-width:88vw;text-shadow:0 0 8px #000,0 0 3px #000;opacity:0;transition:opacity .5s}
#toast.on{opacity:1}
#whisper{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;pointer-events:none;
  font-family:'IM Fell English';font-style:italic;font-size:clamp(22px,4.6vw,44px);color:#a8e8c0;text-shadow:0 0 18px #3f9,0 0 4px #000;opacity:0;transition:opacity 1.8s,filter 1.8s;filter:blur(6px);text-align:center;padding:0 8vw}
#whisper.on{opacity:.85;filter:blur(0)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;transition:opacity .15s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;transition:opacity 1.2s}

/* Dialog */
#dlg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,720px);z-index:12;
  background:linear-gradient(#120e0aee,#070605f2);border:1px solid #6b5636;border-radius:4px;padding:14px 18px 22px;box-shadow:0 10px 40px #000c;pointer-events:auto}
#dlgWho{font-family:'IM Fell English SC';color:#e8c48a;font-size:16px;letter-spacing:2px;margin-bottom:6px}
#dlgWho.tu{color:#9fb3c8}#dlgWho.x{color:#7fd6a2}
#dlgTxt{font-size:19px;line-height:1.45;min-height:56px}
#dlgNext{position:absolute;right:14px;bottom:6px;font-size:13px;opacity:.6;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.15}}

/* Card */
#card{position:fixed;inset:0;background:#000;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vh 8vw;text-align:center;pointer-events:auto}
#card .ln{font-size:clamp(18px,3.4vw,26px);line-height:1.5;margin:6px 0;opacity:0;transition:opacity 1.4s;max-width:720px}
#card .ln.on{opacity:1}
#card .ttl{font-family:'IM Fell English SC';font-size:clamp(28px,6vw,54px);letter-spacing:4px;color:#efe6d0}
#card .sub{font-style:italic;color:#9a9284}
#card .grn{color:#8fdcae;font-style:italic}
#cardCont{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));font-size:14px;opacity:0;transition:opacity 1s;letter-spacing:2px}
#cardCont.on{opacity:.6;animation:blink 1.6s infinite}

/* Panels */
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,520px);max-height:86vh;overflow:auto;z-index:11;
  background:linear-gradient(#15100bf4,#0a0806f8);border:1px solid #6b5636;border-radius:4px;padding:18px 18px 16px;box-shadow:0 20px 60px #000e;pointer-events:auto;touch-action:pan-y}
#panel h2{font-family:'IM Fell English SC';font-weight:normal;color:#e8c48a;letter-spacing:3px;font-size:24px;text-align:center}
#panel .subt{text-align:center;font-style:italic;color:#9a9284;margin:2px 0 12px;font-size:15px}
#panel .row{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px dashed #6b563655;font-size:17px;gap:8px}
#panel .row .r{color:#e8c48a;white-space:nowrap}
#panel .row.bad .r{color:#c8735f}
#panel .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pbtn{padding:12px 14px;border:1px solid #6b5636;background:#1e160dcc;color:#efe6d0;font-size:17px;border-radius:3px;letter-spacing:1px;text-align:left;display:flex;justify-content:space-between;gap:8px}
.pbtn:hover{background:#2c2014}
.pbtn:disabled{opacity:.4}
.pbtn.main{border-color:#e8c48a;color:#f3dfb5;text-align:center;justify-content:center}
.pbtn .r{color:#e8c48a;font-size:14px}
.note{font-size:14px;color:#9a9284;font-style:italic;margin-top:8px;text-align:center}

/* Fishing */
#fishUI{position:fixed;inset:0;z-index:7;pointer-events:none}
#fishHint{position:absolute;left:50%;bottom:calc(132px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:20px;text-align:center;text-shadow:0 0 8px #000,0 0 3px #000;width:min(90vw,640px);transition:color .3s}
#fishHint.alert{color:#ffdf8a;font-size:30px;font-family:'IM Fell English SC';animation:pulse .3s infinite alternate}
#fishHint.soft{color:#cfc6b2;font-style:italic}
#fishHint.weird{color:#a8e8c0;font-style:italic;text-shadow:0 0 10px #3f9,0 0 3px #000}
@keyframes pulse{to{transform:translateX(-50%) scale(1.12)}}
#powerWrap{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(56vw,360px);height:18px;border:1px solid #d9d2c388;background:#000a;border-radius:9px;overflow:hidden}
#powerSweet{position:absolute;top:0;bottom:0;left:72%;width:18%;background:linear-gradient(90deg,#e8c48a33,#ffd98a88,#e8c48a33);border-left:1px solid #ffe2a0;border-right:1px solid #ffe2a0}
#powerBar{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4a5a62,#9fb3c8)}
#powerBar.hot{background:linear-gradient(90deg,#8a6a3a,#ffd98a)}
#reelWrap{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(50vw,460px);padding:10px 14px 12px;
  background:linear-gradient(#0b0f12d8,#050708e8);border:1px solid #6b5636;border-radius:6px;box-shadow:0 8px 30px #000a;transition:border-color .15s,box-shadow .15s}
#reelWrap.warn{border-color:#ffb060;box-shadow:0 0 24px #ff905066}
#reelWrap.run{border-color:#e06a50;box-shadow:0 0 30px #e0503a77;animation:jit .09s infinite alternate}
#reelWrap.calm{border-color:#9fd08a}
#reelWrap.cursedR{border-color:#7fd6a2;box-shadow:0 0 30px #2f885588}
@keyframes jit{to{transform:translateX(calc(-50% + 2px))}}
#rState{font-family:'IM Fell English SC';text-align:center;font-size:24px;letter-spacing:3px;height:30px;color:#bfe8a8;text-shadow:0 0 10px #000}
#reelWrap.warn #rState{color:#ffcf7a}#reelWrap.run #rState{color:#ff8a6a}#reelWrap.cursedR #rState{color:#a8f0c8}
#rTrack{position:relative;height:30px;margin:6px 0 8px;border-bottom:1px dashed #d9d2c344}
#rBoat{position:absolute;left:-4px;bottom:2px;font-size:20px;filter:grayscale(.6)}
#rLine{position:absolute;left:18px;bottom:8px;height:1px;background:#d9d2c3aa;width:0}
#rFish{position:absolute;bottom:4px;width:30px;height:15px;margin-left:-15px;border-radius:50% 40% 40% 50%;background:#c9c2b0;box-shadow:0 0 6px #000;transition:left .08s linear}
#rFish:after{content:'';position:absolute;right:-8px;top:1px;border-left:10px solid currentColor;color:inherit;border-top:6px solid transparent;border-bottom:6px solid transparent;filter:brightness(1)}
#rFish.weird{background:#7fd6a2!important;box-shadow:0 0 12px #3f9}
#rFish.glitch{animation:gl .12s infinite steps(2)}
@keyframes gl{50%{transform:translate(4px,-3px) scaleX(-1);filter:hue-rotate(120deg)}}
#reelWrap.run #rFish{animation:shk .08s infinite alternate}
@keyframes shk{to{transform:translate(0,-4px) rotate(-14deg)}}
#rTen{position:relative;height:12px;border:1px solid #d9d2c355;border-radius:6px;background:#0009;overflow:hidden}
#rTenFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#6d9a5a,#e8c48a 60%,#e0503a);background-size:var(--bw,460px) 100%}
#rTen.beat #rTenFill{background:#7fd6a2;animation:beat .9s infinite}
@keyframes beat{0%,100%{opacity:.5}15%{opacity:1}30%{opacity:.6}45%{opacity:1}}
#rTen span{position:absolute;right:6px;top:-1px;font-size:10px;letter-spacing:2px;opacity:.55;text-transform:uppercase}
#rKnots{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:#9a9284}
#rKnots b{color:#e8c48a;font-weight:normal;letter-spacing:3px}
#fishExit{position:absolute;top:calc(60px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));pointer-events:auto}
#pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:9;pointer-events:none;font-family:'IM Fell English SC';font-size:clamp(26px,5vw,44px);letter-spacing:4px;color:#ffd98a;
  text-shadow:0 0 18px #e8a04a,0 0 4px #000;opacity:0;white-space:nowrap}
#pop.on{animation:popA 1.5s ease-out forwards}
#pop.bad{color:#ff9a7a;text-shadow:0 0 16px #e0503a,0 0 4px #000}
#pop.grn{color:#a8f0c8;text-shadow:0 0 18px #3f9,0 0 4px #000;font-family:'IM Fell English';font-style:italic}
@keyframes popA{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}22%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#act[data-f=tira]{border-color:#9fd08a;color:#e4f5d8;box-shadow:0 0 22px #6d9a5a55,inset 0 0 18px #000}
#act[data-f=molla]{border-color:#e06a50;color:#ffd8cc;background:radial-gradient(#4a1a12dd,#160806dd);box-shadow:0 0 26px #e0503a77,inset 0 0 18px #000}
.stars{text-align:center;font-size:26px;letter-spacing:6px;color:#e8c48a;text-shadow:0 0 12px #e8a04a88;margin:4px 0}
.stars i{color:#4a4034;font-style:normal;text-shadow:none}
.kg{text-align:center;font-size:22px;color:#efe6d0;font-family:'IM Fell English SC';letter-spacing:2px}
.rec{display:block;width:max-content;margin:6px auto 2px;padding:3px 12px;border:1px solid #e8c48a;color:#ffd98a;font-family:'IM Fell English SC';letter-spacing:3px;font-size:14px;border-radius:12px;animation:blink 1s infinite}
#panel.catch{animation:pin .35s ease-out}
@keyframes pin{from{transform:translate(-50%,-44%) scale(.9);opacity:0}}
#panel.cursedP{border-color:#3f8a62;box-shadow:0 0 40px #2f885555,0 20px 60px #000e}
#panel.cursedP h2{color:#a8f0c8}

/* Rotazione */
#rotate{position:fixed;inset:0;z-index:28;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;pointer-events:auto}
#rotate .ph{width:46px;height:78px;border:3px solid #d9d2c3;border-radius:8px;animation:rot 2.2s infinite ease-in-out}
@keyframes rot{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
#rotate .t{font-family:'IM Fell English SC';font-size:24px;letter-spacing:3px;color:#efe6d0}
#rotate small{font-style:italic;color:#9a9284;font-size:15px}
#rotate button{margin-top:12px;background:none;border:1px solid #6b5636;color:#9a9284;padding:8px 14px;font-size:14px;border-radius:3px}
@media (orientation:portrait) and (pointer:coarse){body:not(.portraitOk) #rotate{display:flex}}

/* Note */
#note{position:fixed;inset:0;z-index:14;background:#000c;display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:4vh 4vw}
#note .paper{background:linear-gradient(135deg,#cdbf9e,#a8976f);color:#2a1f12;max-width:520px;padding:28px 26px;font-style:italic;font-size:19px;line-height:1.5;
  box-shadow:0 10px 50px #000;transform:rotate(-1.2deg);border-radius:2px;position:relative}
#note .paper:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,#5a3a1a33,transparent 40%),radial-gradient(circle at 10% 90%,#3a2a1a44,transparent 30%);pointer-events:none}
#note .sig{text-align:right;margin-top:12px;font-family:'IM Fell English SC'}
#note .tap{text-align:center;color:#d9d2c3;opacity:.6;margin-top:16px;font-size:14px}

/* Menu */
#menu{position:fixed;inset:0;z-index:16;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;
  background:radial-gradient(ellipse at center,transparent 20%,#000c 80%);padding:20px;overflow:auto}
#menu h1{font-family:'IM Fell English SC';font-weight:normal;font-size:clamp(46px,11vw,96px);letter-spacing:8px;color:#e9e0cc;text-shadow:0 0 30px #000,0 0 60px #2f6a4a55;line-height:1}
#menu .chap{font-style:italic;font-size:clamp(17px,3.4vw,23px);color:#a8a090;margin:8px 0 22px;text-align:center}
#menu input{background:#0009;border:1px solid #6b5636;color:#efe6d0;font-family:'IM Fell English';font-size:19px;padding:10px 14px;width:min(80vw,300px);text-align:center;border-radius:3px;outline:none;user-select:text;-webkit-user-select:text}
#menu .mb{margin-top:10px;width:min(80vw,300px);padding:12px;border:1px solid #e8c48a;background:#1e160dcc;color:#f3dfb5;font-size:19px;letter-spacing:2px;border-radius:3px}
#menu .mb.sec{border-color:#6b5636;color:#cfc6b2;font-size:16px}
#menuMsg{margin-top:18px;font-style:italic;color:#8f877a;text-align:center;max-width:520px;font-size:15px}
#menuLists{display:flex;gap:28px;margin-top:16px;flex-wrap:wrap;justify-content:center;font-size:14px;color:#8f877a;max-width:640px}
#menuLists h4{font-family:'IM Fell English SC';font-weight:normal;color:#b7ad97;letter-spacing:2px;font-size:14px;margin-bottom:4px;text-align:center}
#menuLists div div{text-align:center}
#netState{position:fixed;bottom:8px;right:10px;font-size:12px;opacity:.45;z-index:17}
#loading{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center;font-family:'IM Fell English SC';letter-spacing:4px;color:#8f877a}
@media (max-width:600px){#hudTL{font-size:13px}#hudTL .big{font-size:16px}#dlgTxt{font-size:17px}}
#menu .mL{display:flex;flex-direction:column;align-items:center}
#menu .mb.sec#btnFull{font-size:14px;padding:8px;opacity:.8}
@media (orientation:portrait){#fishHint{bottom:calc(250px + env(safe-area-inset-bottom))}#reelWrap{bottom:calc(150px + env(safe-area-inset-bottom));width:min(86vw,460px)}#powerWrap{bottom:calc(160px + env(safe-area-inset-bottom));width:70vw}}
/* Orizzontale su telefono: schermi bassi */
@media (max-height:520px){
  #hudTL{font-size:13px;line-height:1.3}#hudTL .big{font-size:15px}
  #compass{height:32px;width:min(38vw,340px)}.cmk{font-size:12px;top:1px}.cmk.card{top:8px}.cmk small{font-size:9px}
  .icoBtn{width:34px;height:34px;font-size:15px}
  #joy{width:112px;height:112px;left:calc(14px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom))}#knob{width:48px;height:48px;margin:-24px 0 0 -24px}
  #act{width:92px;height:92px;font-size:15px;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom))}
  #keysHint{display:none}
  #toast{top:calc(46px + env(safe-area-inset-top));font-size:16px}
  #dlg{width:min(66vw,720px);padding:9px 14px 16px;bottom:calc(10px + env(safe-area-inset-bottom))}#dlgWho{font-size:13px;margin-bottom:3px}#dlgTxt{font-size:16px;min-height:44px;line-height:1.35}
  #panel{max-height:94vh;padding:12px 14px;width:min(92vw,640px)}#panel h2{font-size:20px}#panel .subt{font-size:14px;margin-bottom:6px}#panel .row{font-size:15px;padding:4px 2px}
  .pbtn{padding:9px 12px;font-size:15px}.stars{font-size:20px}.kg{font-size:18px}
  #card{padding:4vh 8vw}#card .ln{font-size:clamp(16px,3.6vh,22px);margin:3px 0}#card .ttl{font-size:clamp(26px,9vh,44px)}
  #fishHint{top:calc(48px + env(safe-area-inset-top));bottom:auto;font-size:17px}#fishHint.alert{font-size:26px}
  #powerWrap{bottom:calc(30px + env(safe-area-inset-bottom))}
  #reelWrap{bottom:calc(10px + env(safe-area-inset-bottom));padding:6px 12px 8px;width:min(48vw,440px)}#rState{font-size:20px;height:24px}#rTrack{height:24px;margin:3px 0 6px}
  #fishExit{top:calc(48px + env(safe-area-inset-top))}
  #note .paper{font-size:16px;padding:18px 20px;max-height:86vh;overflow:auto}
  #menu h1{font-size:clamp(40px,12vh,64px);letter-spacing:6px}#menu .chap{margin:4px 0 10px;font-size:16px}
  #menu input,#menu .mb{font-size:16px;padding:8px}#menu .mb{margin-top:7px}#menuMsg{margin-top:8px;font-size:13px}
  #menuLists{font-size:12px;gap:16px;margin-top:8px}
}
@media (max-height:520px) and (min-width:640px){
  #panel .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}#panel .btns .pbtn.main,#panel .btns .note{grid-column:1/-1}#panel .btns .pbtn.main{order:-1}#panel.catch .btns{grid-template-columns:1fr}#panel.catch .btns .pbtn.main{order:0}
  #menu{flex-direction:row;gap:5vw}#menuLists{flex-direction:column;gap:10px;max-width:30vw}
}
</style>
</head>
<body>

function itemValue(it, buyer = 'abel') {

  const base = price(it.k); if (!base) return 0;

const AU = { ctx: null, on: true };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const C = new (window.AudioContext || window.webkitAudioContext)(); AU.ctx = C;
  AU.master = C.createGain(); AU.master.gain.value = AU.on ? 0.9 : 0; AU.master.connect(C.destination);

  AU.sfx = C.createGain(); AU.sfx.gain.value = 1; AU.sfx.connect(AU.master);

  AU.windG = C.createGain(); AU.windG.gain.value = 0.03; noise().connect(wf).connect(AU.windG).connect(AU.bus);

  AU.rainG = C.createGain(); AU.rainG.gain.value = 0; noise().connect(rf).connect(AU.rainG).connect(AU.bus);
  // motore

  AU.engG = C.createGain(); AU.engG.gain.value = 0;
  AU.eo1 = C.createOscillator(); AU.eo1.type = 'sawtooth'; AU.eo1.frequency.value = 40;
  AU.eo2 = C.createOscillator(); AU.eo2.type = 'square'; AU.eo2.frequency.value = 20;
  AU.eo1.connect(ef); AU.eo2.connect(ef); ef.connect(AU.engG).connect(AU.bus); AU.eo1.start(); AU.eo2.start();

  df.connect(AU.droneG).connect(AU.master);

  AU.padG = C.createGain(); AU.padG.gain.value = 0.05; AU.padF.connect(AU.padG).connect(AU.bus);

}
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }

function burst(dur, f, q, vol, type = 'bandpass', when = 0, att = 0.01) {

}

const WAVES = [[1, .3, .065, .55, .9], [-.4, 1, .09, .35, 1.25], [.7, -.7, .14, .18, 1.7], [-.9, -.2, .21, .1, 2.3], [.2, .95, .33, .05, 3.1]]

function runeTex(w = 128, h = 512, rows = 14) {

  g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.strokeStyle = '#8fffc0'; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < rows; i++) {
    const cy = 22 + i * (h - 30) / rows, cx = w / 2 + rand(-12, 12);
    g.beginPath(); for (let k = 0; k < 5; k++) { const a = rand(0, Math.PI * 2), r = rand(4, 14); if (k === 0) g.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); else g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } g.stroke();
    if (Math.random() < .5) { g.beginPath(); g.arc(cx, cy, rand(3, 8), 0, Math.PI * rand(1, 2)); g.stroke(); }

}

function computeEnv(hour) {
  let a = PAL[0], b = PAL[PAL.length - 1];
  for (let i = 0; i < PAL.length - 1; i++) if (hour >= PAL[i][0] && hour <= PAL[i + 1][0]) { a = PAL[i]; b = PAL[i + 1]; break; }
  const t = (hour - a[0]) / Math.max(.001, b[0] - a[0]);
  ENV.top.lerpColors(a[1], b[1], t); ENV.hor.lerpColors(a[2], b[2], t); ENV.sunC.lerpColors(a[3], b[3], t);
  ENV.sunI = lerp(a[4], b[4], t); ENV.hemiI = lerp(a[5], b[5], t);
  if (R.overcast) { ENV.hor.lerp(grey, R.overcast * .5); ENV.top.lerp(grey, R.overcast * .35); ENV.sunI *= 1 - R.overcast * .5; }
  const c = clamp(corr, 0, 1); ENV.top.lerp(corrTop, c * .7); ENV.hor.lerp(corrHor, c * .75);
  if (hour < 20) { const s = (hour - 6) / 14 * Math.PI; ENV.dir.set(Math.cos(s) * .8, Math.max(Math.sin(s), .04) * .9 + .06, -.5).normalize(); }
  else ENV.dir.set(-.45, .55, -.6).normalize();
}

    w.m.color.set(on ? 0xffb25a : (night ? 0x0d0c0a : 0x2a251e));

  jonahLight.intensity = 3.5 + Math.sin(T * 9) * .4;
  // monolite e fossa
  monoMat.emissiveIntensity = (.05 + C * 1.4) * (.7 + .3 * Math.sin(T * 1.3));
  idolMat.emissiveIntensity = .25 + .35 * Math.pow(Math.max(0, Math.sin(T * 2.2)), 8) * 3;
  // banchi
  for (const s of SPOTS) {
    if (!s.g.visible) continue; s.g.position.set(s.x, H(s.x, s.z) + .06, s.z);
    s.rings.forEach((m, i) => { const t = (T * .45 + i / 3) % 1; const sc = (s.fossa ? 6 : 1.5) + t * (s.fossa ? 16 : 5); m.scale.set(sc, 1, sc); m.material.opacity = (1 - t) * (s.fossa ? .5 : .35); });
  }
  // barche ormeggiate
  for (const b of MOORED) { b.position.y = H(b.position.x, b.position.z) * .7 + .2; b.rotation.z = Math.sin(T * .8 + b.userData.bob) * .04; }
  // pioggia
  rain.visible = rainAmt > .02; rain.material.opacity = rainAmt * .4;
  if (rain.visible) {
    const n = Math.floor(RAIN_N * rainAmt);
    for (let i = 0; i < RAIN_N; i++) {
      const s = rainSeed[i]; s[1] -= dt * 28; if (s[1] < -2) s[1] += 32;
      const x = camera.position.x + s[0], y = camera.position.y + s[1] - 10, z = camera.position.z + s[2], j = i * 6;
      if (i < n) { rainPos[j] = x; rainPos[j + 1] = y; rainPos[j + 2] = z; rainPos[j + 3] = x - .1; rainPos[j + 4] = y - .9; rainPos[j + 5] = z; }
      else { rainPos[j + 1] = rainPos[j + 4] = -999; }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  // ombra sotto la barca
  if (R.shadow) {
    const sh = R.shadow; sh.t += dt; sh.p.addScaledVector(sh.dir, dt * 22);
    const a = sh.t < 1.5 ? sh.t / 1.5 : sh.t > 5 ? Math.max(0, 1 - (sh.t - 5) / 1.5) : 1;
    waterU.uShadow.value.set(sh.p.x, sh.p.z, -sh.ang, a);
    if (sh.t > 6.5) { R.shadow = null; waterU.uShadow.value.w = 0; }
  }
  // occhi
  R.eyesT += dt;
  EYES.forEach((e, i) => {
    if (R.eyesOn) {
      if (!e.g.visible && R.eyesT > i * .25) { e.g.visible = true; e.ang = rand(0, Math.PI * 2); e.d = rand(7, 22); e.t = 0; }
      if (e.g.visible) {
        e.t += dt; const x = boat.pos.x + Math.cos(e.ang) * e.d, z = boat.pos.z + Math.sin(e.ang) * e.d;
        e.g.position.set(x, H(x, z) + .15, z); e.g.lookAt(boat.pos.x, e.g.position.y, boat.pos.z);
        const bl = (Math.sin(e.t * 2 + i) > .97) ? .1 : 1; e.g.scale.set(1, Math.min(1, e.t * 2) * bl, 1);

}
function updateStory(dt) {
  if (mode !== 'sail' && mode !== 'fish') return;
  R.edgeT -= dt; R.dronePulse = Math.max(0, R.dronePulse - dt * .05);
  const dPort = Math.hypot(boat.pos.x - DOCK.x, boat.pos.z - DOCK.z);
  if (!S.flags.idolo && !(S.capitolo === 1 && S.giorno >= 3)) {
    if (clock >= 1110 && !R.warned1) { R.warned1 = true; toast('Il sole sta calando. Ad Ashcombe nessuno pesca di notte.', 4); SFX.bell(); }
    if (clock >= 1200 && !R.warned2) { R.warned2 = true; toast('È notte. Torna in porto. Segui il faro.', 4); corrPulse = .25; SFX.weird(); }
    if (clock >= 1200) R.dronePulse = Math.max(R.dronePulse, (clock - 1200) / 120 * .2);
    if (clock >= 1320 && mode === 'sail') { lostAtNight(); return; }
  }
  if ((S.giorno === 2 || S.giorno === 5) && !R.shadowDone && dPort > 140 && clock > 560 && mode === 'sail') triggerShadow();
  if (S.giorno >= 3 && !S.flags.idolo) {
    const dF = Math.hypot(boat.pos.x - FOSSA.x, boat.pos.z - FOSSA.z);
    if (dF < 95 && !R.fossaIn) { R.fossaIn = true; toast(`L'acqua qui è nera come inchiostro.`, 4); SFX.weird(); corrPulse = .3; }
    corr = lerp(corr, dF < 120 ? .34 : .16, 1 - Math.exp(-dt * .5));
    if (dF < 120) R.dronePulse = Math.max(R.dronePulse, .08);
  }
  // Capitolo II: il pescato sbagliato parla dalla stiva
  if (S.capitolo === 2 && cursedInHold().length) {
    R.whisperT -= dt;
    if (R.whisperT < 0) { R.whisperT = rand(28, 50); whisper(pick(['Portaci da Lui.', 'Siamo tanti, quaggiù.', '{nome}... {nome}...', 'Non venderci.', 'Fa freddo, nella stiva.', 'Tuo padre è qui con noi.']).replace(/\{nome\}/g, S.nome), 2800); corrPulse = .25; SFX.heart(); }
  }
  if (S.flags.idolo) {
    R.whisperT -= dt;
    if (R.whisperT < 0) { R.whisperT = rand(16, 30); whisper(pick(['A casa.', 'Ti conosco, {nome}.', 'Tuo padre ti saluta.', 'Più giù.', 'Non abbiamo fretta.', 'Il mare ricorda.']).replace('{nome}', S.nome), 3000); corrPulse = .3; }
    R.lightningT -= dt;
    if (R.lightningT < 0) { R.lightningT = rand(9, 18); flash(.35); setTimeout(SFX.thunder, rand(300, 1200)); }
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, .05); lastT = now; T += dt;
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  if (mode === 'fish' && !paused) updateFishing(dt);
  updateBoat(dt); updateStory(dt); updateWorld(dt); updateCamera(dt);
  if (S && mode !== 'menu' && mode !== 'loading') updateHud(dt);
  audioUpdate(dt);
  composer.render();
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 74 : 60; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
document.addEventListener('visibilitychange', () => { if (!AU.ctx) return; if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); });

/* =========================================================
   MENU
   ========================================================= */
let saved = null;
async function showMenu() {
  mode = 'menu'; setHud(false); closePanel(); S = freshState(''); $('fishUI').classList.add('hidden');
  corr = .12; storm = .9; clock = 1110; scene.fog.density = .0055; R.overcast = .4; rainAmt = .2; DOCK_POS(); monolith.visible = false; idolMesh.visible = false; uomoNero.visible = false; R.beamOn = true; actEl.classList.remove('cursed');
  $('menu').classList.remove('hidden');
  saved = await loadGame();
  const nm = saved?.nome || localStorage.getItem('mn_nome') || ''; $('nameIn').value = nm;
  const bc = $('btnCont'), bn = $('btnNew');
  const cap = saved?.capitolo || 1, playable = !!(saved && CHAP[cap] && CHAP[cap].ultimo);
  $('menuChap').textContent = `Capitolo ${ROMAN[playable ? cap : 1]} — ${CHAP[playable ? cap : 1].nome}`;
  if (playable && saved.giorno) { bc.classList.remove('hidden'); bc.textContent = `Continua — Cap. ${ROMAN[cap]}, Giorno ${saved.giorno}`; bn.textContent = 'Nuova partita'; bn.classList.add('sec'); }
  else { bc.classList.add('hidden'); bn.textContent = saved ? 'Nuova partita' : 'Salpa'; bn.classList.remove('sec'); }
  let msg = `«${CFG.messaggio}»`;
  if (saved && cap >= 3) msg += `<br><br>Hai completato il Capitolo II. Il Capitolo III — <i>${CHAP[3].nome}</i> — arriverà presto. La tua partita è salvata.`;
  $('menuMsg').innerHTML = msg;
  $('btnFull').classList.toggle('hidden', !fsSupported);
}
$('btnNew').addEventListener('click', () => {
  audioInit(); SFX.click();
  if (saved && saved.capitolo >= 2 && !confirm('Ricominciare dal Capitolo I? I progressi attuali andranno persi.')) return;
  goFull();
  const nome = ($('nameIn').value || '').trim().slice(0, 18) || 'Pescatore';
  localStorage.setItem('mn_nome', nome);
  S = freshState(nome); fbSet('giocatori/' + pid, null); beginGame();
});
$('btnCont').addEventListener('click', () => {
  audioInit(); SFX.click(); if (!saved) return; goFull();
  S = saved; const nome = ($('nameIn').value || '').trim(); if (nome) S.nome = nome.slice(0, 18);
  beginGame();
});
function beginGame() {
  $('menu').classList.add('hidden'); fadeTo(1, () => { fadeTo(0); startDay(); }, 900);
}
/* ---------- Schermo intero e orientamento orizzontale ---------- */
const DE = document.documentElement;
const fsSupported = !!(DE.requestFullscreen || DE.webkitRequestFullscreen);
let fsManualExit = false;
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function lockLandscape() { try { const p = screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
function goFull() {
  if (!fsSupported || isFull()) { lockLandscape(); return; }
  try {
    const p = DE.requestFullscreen ? DE.requestFullscreen({ navigationUI: 'hide' }) : DE.webkitRequestFullscreen();
    if (p && p.then) p.then(lockLandscape).catch(() => {}); else lockLandscape();
  } catch (e) {}
}
function toggleFull() {
  if (isFull()) { fsManualExit = true; (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { fsManualExit = false; goFull(); }
}
$('btnFull').addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
$('fsBtn').addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
$('rotSkip').addEventListener('click', e => { e.stopPropagation(); document.body.classList.add('portraitOk'); });
// appena il telefono viene girato in orizzontale, prova ad andare a schermo intero al primo tocco
addEventListener('pointerdown', () => { if (isTouch && !fsManualExit && innerWidth > innerHeight && mode !== 'loading' && !isFull()) goFull(); }, { capture: true });
function renderList(id, data, fmt) {
  const el = $(id); if (!data) { el.textContent = '—'; return; }
  el.innerHTML = Object.values(data).sort((a, b) => b.ts - a.ts).slice(0, 6).map(fmt).join('');
}
function listenGlobal() {
  fbOn('config/messaggio', v => { if (v) { CFG.messaggio = v; if (mode === 'menu') $('menuMsg').innerHTML = `«${v}»`; } });
  fbOnLast('annali', 8, d => renderList('lstAnnali', d, a => `<div>${esc(a.nome)} — ${esc(a.pesce)}${a.giorno ? ` <i>(g.${a.giorno})</i>` : ''}</div>`));
  fbOnLast('dispersi', 8, d => renderList('lstDispersi', d, a => `<div>${esc(a.nome)}${a.capitolo ? ` <i>(cap. ${ROMAN[a.capitolo] || a.capitolo})</i>` : ''}</div>`));
  fbOnLast('annegati', 40, d => {
    ANNEGATI = Object.entries(d || {}).map(([id, v]) => ({ id, ...v })).filter(a => a && a.nome && a.pid !== pid);
    renderList('lstAnnegati', d, a => `<div>${esc(a.nome)}</div>`);
  });
  // broadcast dall'admin: scrivi {testo, ts} in /marea_nera/broadcast e tutti i giocatori in mare lo "sentono"
  let lastB = 0;
  fbOn('broadcast', b => { if (!b || !b.testo || !b.ts || b.ts === lastB) return; lastB = b.ts; if (Date.now() - b.ts < 120000 && (mode === 'sail' || mode === 'fish' || mode === 'port')) whisper(b.testo, 4500); });
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =========================================================
   AVVIO
   ========================================================= */
// strumenti di prova: apri index.html?debug
if (location.search.includes('debug')) window.MN = { get S() { return S; }, set S(v) { S = v; }, get mode() { return mode; }, F, boat, SPOTS, FISH, startDay, startFishing, openPort, goHome, finale2, get clock() { return clock; }, set clock(v) { clock = v; } };
requestAnimationFrame(frame);
(async () => {
  await fbInit();
  await loadConfig();
